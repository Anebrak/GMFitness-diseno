<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="arc/CSS/rutinas.css">
    <title>Rutinas - GMFitness</title>
</head>

<body>
    <header>
        <nav>
            <div id="usuario-bola">DM</div>
            <h1>GMFitness</h1>
        </nav>
    </header>

    <aside id="barra-lateral">
        <button type="button" id="btn-toggle" class="item-lateral" aria-label="Expandir o contraer barra lateral">
            <i class="fa-solid fa-bars"></i>
            <span>Contraer</span>
        </button>
        <button type="button" class="item-lateral activo" data-vista="mis-rutinas">
            <i class="fa-solid fa-clipboard-list"></i>
            <span>Mis rutinas</span>
        </button>
        <button type="button" class="item-lateral" data-vista="profesionales">
            <i class="fa-solid fa-user-doctor"></i>
            <span>Rutinas profesionales</span>
        </button>
        <button type="button" class="item-lateral" data-vista="actual">
            <i class="fa-solid fa-person-running"></i>
            <span>Mi rutina actual</span>
        </button>
        <button type="button" class="item-lateral" data-vista="ejercicios">
            <i class="fa-solid fa-dumbbell"></i>
            <span>Ejercicios</span>
        </button>
    </aside>

    <main id="contenido">


        <section class="vista activo" id="vista-mis-rutinas">
            <div class="encabezado-vista"><h1 class="titulo-vista">Mis rutinas</h1></div>
            <div class="grid-rutinas" id="grid-mis-rutinas"></div>
        </section>

    
        <section class="vista" id="vista-constructor">
            <div class="encabezado-vista">
                <h1 class="titulo-vista">Crear rutina</h1>
                <button type="button" id="btn-cancelar-rutina" class="btn boton-secundario">Cancelar</button>
            </div>
            <div class="grupo-campo campo-nombre">
                <label for="rutina-nombre">Nombre de la rutina</label>
                <input type="text" id="rutina-nombre" maxlength="40" placeholder="Ej: Fuerza 4 semanas">
            </div>
            <div class="tabla-contenedor" id="constructor-tabla"></div>
            <p class="error-modal" id="error-rutina"></p>
            <div class="modal-botones">
                <button type="button" id="btn-crear-rutina" class="btn boton-primario">Crear rutina</button>
            </div>
        </section>

  
        <section class="vista" id="vista-profesionales">
            <div class="encabezado-vista"><h1 class="titulo-vista">Rutinas de profesionales</h1></div>
            <div class="grid-rutinas" id="grid-profesionales"></div>
        </section>


        <section class="vista" id="vista-actual">
            <div class="encabezado-vista">
                <h1 class="titulo-vista">Mi rutina actual</h1>
                <button type="button" id="btn-cambiar-rutina" class="btn boton-secundario oculto">Cambiar rutina</button>
            </div>
            <div id="actual-vacio">
                <i class="fa-solid fa-person-running"></i>
                <h2>Aún no tienes una rutina asignada</h2>
                <p>Elige una rutina tuya o de un profesional para empezar.</p>
                <button type="button" id="btn-iniciar-rutina" class="btn boton-primario">Inicia una rutina</button>
            </div>
            <div id="actual-contenido" class="oculto"></div>
        </section>

        <section class="vista" id="vista-ejercicios">
            <div class="encabezado-vista">
                <h1 class="titulo-vista">Ejercicios</h1>
                <button type="button" id="btn-nuevo-ejercicio" class="btn boton-primario">
                    <i class="fa-solid fa-plus"></i> Nuevo ejercicio
                </button>
            </div>
            <div id="ejercicios-layout">
                <div id="lista-ejercicios"></div>
                <aside id="detalle-ejercicio"></aside>
            </div>
        </section>
    </main>

    <div class="modal-overlay" id="modal-semanas" aria-hidden="true">
        <section class="modal-caja modal-pequeno" role="dialog" aria-modal="true">
            <button class="modal-cerrar" type="button" data-cerrar aria-label="Cerrar">&times;</button>
            <h2>Crear rutina</h2>
            <form id="form-semanas" novalidate>
                <div class="campos-modal" style="text-align:left">
                    <div class="grupo-campo">
                        <label for="num-semanas">¿Cuántas semanas durará la rutina?</label>
                        <input type="number" id="num-semanas" min="1" max="24" value="4" inputmode="numeric">
                    </div>
                </div>
                <p class="error-modal" id="error-semanas"></p>
                <div class="modal-botones">
                    <button type="button" class="btn boton-secundario" data-cerrar>Cancelar</button>
                    <button type="submit" class="btn boton-primario">Aceptar</button>
                </div>
            </form>
        </section>
    </div>

   
    <div class="modal-overlay" id="modal-agregar-ej" aria-hidden="true">
        <section class="modal-caja" role="dialog" aria-modal="true">
            <button class="modal-cerrar" type="button" data-cerrar aria-label="Cerrar">&times;</button>
            <h2>Agregar ejercicio</h2>
            <form id="form-agregar-ej" novalidate>
                <div class="campos-modal">
                    <div class="grupo-campo">
                        <label for="ae-grupo">Grupo muscular</label>
                        <select id="ae-grupo"></select>
                    </div>
                    <div class="grupo-campo">
                        <label for="ae-ejercicio">Seleccionar ejercicio</label>
                        <select id="ae-ejercicio"></select>
                    </div>
                    <div class="grupo-campo">
                        <label for="ae-series">Series</label>
                        <input type="number" id="ae-series" min="1" max="20" value="3" inputmode="numeric">
                    </div>
                    <div class="fila-dos">
                        <div class="grupo-campo">
                            <label for="ae-rep-tipo">Repeticiones</label>
                            <select id="ae-rep-tipo">
                                <option value="max">Reps máximas</option>
                                <option value="rango">Rango de reps</option>
                                <option value="amrap">AMRAP</option>
                            </select>
                        </div>
                        <div class="grupo-campo">
                            <label for="ae-esf">Esfuerzo</label>
                            <select id="ae-esf">
                                <option value="rir">RIR</option>
                                <option value="arm">ARM</option>
                            </select>
                        </div>
                    </div>
                    <div class="fila-dos">
                        <div class="fila-dos" id="ae-reps-cajas">
                            <div class="grupo-campo"><label for="ae-rep-a" id="ae-rep-a-label">Reps</label><input type="number" id="ae-rep-a" min="1" max="100" value="10"></div>
                            <div class="grupo-campo oculto" id="ae-rep-b-grupo"><label for="ae-rep-b">Reps finales</label><input type="number" id="ae-rep-b" min="1" max="100" value="12"></div>
                        </div>
                        <div class="grupo-campo" id="ae-esf-grupo"><label for="ae-esf-val">Valor RIR</label><input type="number" id="ae-esf-val" min="0" max="10" value="2"></div>
                    </div>
                </div>
                <p class="error-modal" id="error-agregar-ej"></p>
                <div class="modal-botones">
                    <button type="button" class="btn boton-secundario" data-cerrar>Cancelar</button>
                    <button type="submit" class="btn boton-primario">Agregar</button>
                </div>
            </form>
        </section>
    </div>

   
    <div class="modal-overlay" id="modal-ver" aria-hidden="true">
        <section class="modal-caja modal-ancho" role="dialog" aria-modal="true">
            <button class="modal-cerrar" type="button" data-cerrar aria-label="Cerrar">&times;</button>
            <h2 id="ver-titulo"></h2>
            <div class="tabla-contenedor" id="ver-tabla"></div>
            <div class="modal-botones" id="ver-botones"></div>
        </section>
    </div>

  
    <div class="modal-overlay" id="modal-iniciar" aria-hidden="true">
        <section class="modal-caja" role="dialog" aria-modal="true">
            <button class="modal-cerrar" type="button" data-cerrar aria-label="Cerrar">&times;</button>
            <h2>Elige tu rutina</h2>
            <div class="selector-fuente">
                <button type="button" class="btn boton-primario" data-fuente="mias">Mis rutinas</button>
                <button type="button" class="btn boton-secundario" data-fuente="pro">De profesionales</button>
            </div>
            <div id="lista-iniciar"></div>
        </section>
    </div>

  
    <div class="modal-overlay" id="modal-nuevo-ej" aria-hidden="true">
        <section class="modal-caja" role="dialog" aria-modal="true">
            <button class="modal-cerrar" type="button" data-cerrar aria-label="Cerrar">&times;</button>
            <h2>Nuevo ejercicio</h2>
            <form id="form-nuevo-ej" novalidate>
                <div class="campos-modal">
                    <div class="grupo-campo"><label for="ne-nombre">Nombre</label><input type="text" id="ne-nombre" maxlength="50"></div>
                    <div class="grupo-campo"><label for="ne-grupo">Grupo muscular</label><input type="text" id="ne-grupo" list="lista-grupos" maxlength="30"><datalist id="lista-grupos"></datalist></div>
                    <div class="grupo-campo"><label for="ne-maquina">Máquina / equipo</label><input type="text" id="ne-maquina" maxlength="40"></div>
                    <div class="grupo-campo"><label for="ne-imagen">URL de la imagen (opcional)</label><input type="url" id="ne-imagen" placeholder="https://..."></div>
                    <div class="grupo-campo"><label for="ne-desc">Descripción</label><textarea id="ne-desc" rows="3" maxlength="300"></textarea></div>
                </div>
                <p class="error-modal" id="error-nuevo-ej"></p>
                <div class="modal-botones">
                    <button type="button" class="btn boton-secundario" data-cerrar>Cancelar</button>
                    <button type="submit" class="btn boton-primario">Guardar</button>
                </div>
            </form>
        </section>
    </div>

    
    <div class="modal-overlay" id="modal-registro" aria-hidden="true">
        <section class="modal-caja modal-pequeno" role="dialog" aria-modal="true">
            <button class="modal-cerrar" type="button" data-cerrar aria-label="Cerrar">&times;</button>
            <h2>Nuevo registro</h2>
            <form id="form-registro" novalidate>
                <div class="campos-modal" style="text-align:left">
                    <div class="grupo-campo"><label for="rg-peso">Peso (kg)</label><input type="number" id="rg-peso" min="0" step="0.5" inputmode="decimal"></div>
                    <div class="grupo-campo"><label for="rg-reps">Repeticiones</label><input type="number" id="rg-reps" min="1" inputmode="numeric"></div>
                </div>
                <p class="error-modal" id="error-registro"></p>
                <div class="modal-botones">
                    <button type="button" class="btn boton-secundario" data-cerrar>Cancelar</button>
                    <button type="submit" class="btn boton-primario">Guardar</button>
                </div>
            </form>
        </section>
    </div>

    <script src="arc/JS/rutinas.js"></script>
    <script src="arc/JS/navegacion.js"></script>
</body>

</html>
